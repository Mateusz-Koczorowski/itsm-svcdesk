# svcdesk compose file. Lab 1 contract (API.md section 9) plus Lab 3 (MONITORING-SPEC.md M-01, M-02):
# kb-index, the course's seeded dependency, and our own Prometheus and Grafana under the "observability" profile.
# No host-path bind mounts on svcdesk or kb-index; our own prometheus and grafana may bind-mount their configuration,
# because the checker never starts them.
services:
  svcdesk:
    build: .
    ports:
      - "8080:8080"               # local work only; the checker removes it in container mode
    environment:
      SVCDESK_TEST_CLOCK: "1"     # enables the X-Test-Clock header (API.md section 8)
      KB_INDEX_URL: http://kb-index:8080   # M-02
    volumes:
      - svcdesk-data:/data        # named volume: tickets survive a restart (R-23)
    depends_on:
      - kb-index
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  kb-index:
    image: ghcr.io/swasik/seeded-toxic:2026
    environment:
      SEEDED_TOXIC_LOGIN: mateusz-koczorowski   # my GitHub login (M-01); the checker sets it to the same value
    ports:
      - "8081:8080"               # /stats and /admin/degrade from the laptop
    # No healthcheck: the image has no shell, so a command-based check can never pass (L3-CORE-1.04).

  prometheus:
    image: prom/prometheus:v3.15.0
    profiles: ["observability"]
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus:/etc/prometheus:ro

  grafana:
    image: grafana/grafana:13.2.3
    profiles: ["observability"]
    ports:
      - "3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro

  # Stretch S3 (Labs 1-2): own tests, run with `docker compose --profile tests run --rm --build tests`.
  tests:
    build: .
    profiles: ["tests"]
    working_dir: /app/src
    depends_on:
      svcdesk:
        condition: service_healthy
    environment:
      SVCDESK_URL: http://svcdesk:8080
    command: ["python", "-m", "tests.run"]

volumes:
  svcdesk-data:
