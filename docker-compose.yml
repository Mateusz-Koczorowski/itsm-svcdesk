# Lab 1 compose contract (API.md section 9): service "svcdesk" built from this repository, port 8080 inside the
# container, SVCDESK_TEST_CLOCK set, a named volume only (no bind mounts), no network needed once built.
services:
  svcdesk:
    build: .
    ports:
      - "8080:8080"               # local work only; the checker removes it in container mode
    environment:
      SVCDESK_TEST_CLOCK: "1"     # enables the X-Test-Clock header (API.md section 8)
    volumes:
      - svcdesk-data:/data        # named volume: tickets survive a restart (R-23)
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  # Stretch S3: own tests, run with `docker compose --profile tests run --rm --build tests`.
  tests:
    build: .
    profiles: ["tests"]
    working_dir: /app/src
    depends_on:
      svcdesk:
        condition: service_healthy
    environment:
      SVCDESK_URL: http://svcdesk:8080
    command: ["python", "-m", "tests.run"]

volumes:
  svcdesk-data:
