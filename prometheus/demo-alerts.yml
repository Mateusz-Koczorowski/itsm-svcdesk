# ai-generated: 85% - Claude wrote the rules and tuned the thresholds on the recording's healthy baseline; I chose what pages and what goes to chat
# prometheus/demo-alerts.yml - symptom alerts on the shop (INCIDENT-SPEC.md I-01, I-02, I-05).
# The shop's span metrics arrive once a minute, so every rate() uses a 5-minute window, and only SERVER spans count:
# what a service answered its callers. P1 pages on what a customer feels at checkout; P2 and P3 are cause and
# side-symptom alerts for chat. Every rule carries `cluster: shop`, the label the inhibit rule compares (`equal`).
# All rules sit in ONE group, so on equal starts the most severe alert is the detecting one (INCIDENT-SPEC.md 4.3).
groups:
  - name: shop-symptoms
    rules:
      # P1: orders fail. Every fault the injector draws fails or slows checkout, so this one and the next page on
      # every draw between them.
      - alert: CheckoutErrorRate
        expr: |
          sum(rate(traces_span_metrics_calls_total{service_name="checkout", span_kind="SPAN_KIND_SERVER", status_code="STATUS_CODE_ERROR"}[5m]))
            /
          sum(rate(traces_span_metrics_calls_total{service_name="checkout", span_kind="SPAN_KIND_SERVER"}[5m]))
            > 0.05
        for: 1m
        labels:
          service: checkout
          severity: P1
          cluster: shop
        annotations:
          summary: "More than 5 % of orders (checkout PlaceOrder) fail over 5 minutes"

      # P1: orders are slow. Healthy PlaceOrder p95 is about 50 ms; 2 s is far outside anything the healthy shop does.
      - alert: CheckoutLatencyHigh
        expr: |
          histogram_quantile(0.95, sum by (le) (rate(traces_span_metrics_duration_milliseconds_bucket{service_name="checkout", span_kind="SPAN_KIND_SERVER", span_name="oteldemo.CheckoutService/PlaceOrder"}[5m])))
            > 2000
        for: 1m
        labels:
          service: checkout
          severity: P1
          cluster: shop
        annotations:
          summary: "Checkout p95 above 2 s over 5 minutes: customers wait seconds to place an order"

      # P2 (chat): a cause behind slow orders. Healthy ship-order p99 is about 5 ms.
      - alert: ShippingLatencyHigh
        expr: |
          histogram_quantile(0.99, sum by (le) (rate(traces_span_metrics_duration_milliseconds_bucket{service_name="shipping", span_kind="SPAN_KIND_SERVER"}[5m])))
            > 2000
        for: 1m
        labels:
          service: shipping
          severity: P2
          cluster: shop
        annotations:
          summary: "Shipping p99 above 2 s over 5 minutes: slow ShipOrder calls delay checkout"

      # P3 (chat): ads fail. No order depends on an ad, so this never pages.
      - alert: AdErrorRate
        expr: |
          sum(rate(traces_span_metrics_calls_total{service_name="ad", span_kind="SPAN_KIND_SERVER", status_code="STATUS_CODE_ERROR"}[5m]))
            /
          sum(rate(traces_span_metrics_calls_total{service_name="ad", span_kind="SPAN_KIND_SERVER"}[5m]))
            > 0.02
        for: 1m
        labels:
          service: ad
          severity: P3
          cluster: shop
        annotations:
          summary: "More than 2 % of ad requests fail over 5 minutes"
