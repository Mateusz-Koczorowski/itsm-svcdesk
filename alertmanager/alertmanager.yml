# ai-generated: 80% - Claude wrote the tree from the course template; I chose that only P1 pages and that a shop page mutes shop chat alerts
# alertmanager/alertmanager.yml - the routing tree (INCIDENT-SPEC.md I-04 to I-08).
# P1 goes to the pager (the on-call's phone), P2 and P3 to chat. While a shop P1 fires, the shop's P2 and P3 alerts
# are muted: the person already paged does not need the same incident again in chat. The inhibition compares the
# label `cluster`, which every shop alert carries (`cluster: shop`); svcdesk's alerts do not carry it, so a shop page
# never mutes them.
global:
  resolve_timeout: 5m
route:
  receiver: chat                  # anything without a P1-P3 severity ends in chat, never on the pager
  group_by: [alertname, service]
  group_wait: 10s
  group_interval: 1m
  repeat_interval: 4h
  routes:
    - matchers: ['severity="P1"']
      receiver: pager
    - matchers: ['severity=~"P2|P3"']
      receiver: chat
receivers:
  - name: pager
    webhook_configs:
      - url: http://pager:8080/hook/pager
        send_resolved: true
  - name: chat
    webhook_configs:
      - url: http://pager:8080/hook/chat
        send_resolved: true
inhibit_rules:
  - source_matchers: ['severity="P1"']
    target_matchers: ['severity=~"P2|P3"']
    equal: [cluster]
